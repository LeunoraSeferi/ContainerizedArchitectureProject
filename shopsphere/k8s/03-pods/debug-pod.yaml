# debug-pod.yaml
# ----------------
# PURPOSE:
# Standalone Pod (rubric requires "Pods" as a Kubernetes object).
# Use for demo: exec into the pod and curl internal services (gateway, auth, catalog, order)
# to verify connectivity without exposing Services externally.
#
# Apply to any namespace: kubectl apply -n <dev|staging|prod> -f 03-pods/debug-pod.yaml
# Usage: kubectl exec -it debug-curl -n <ns> -- curl -s http://gateway:4000/...

apiVersion: v1
kind: Pod
metadata:
  name: debug-curl
  labels:
    app: debug-curl
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:latest
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "30m"
          memory: "48Mi"
        limits:
          cpu: "50m"
          memory: "64Mi"
