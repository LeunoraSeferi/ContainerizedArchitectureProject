# limitrange-dev.yaml
# -------------------
# PURPOSE:
# Your dev ResourceQuota requires every Pod to define:
# - requests.cpu / requests.memory
# - limits.cpu / limits.memory
#
# A LimitRange sets DEFAULTS automatically, so every container
# gets requests/limits even if we forget to add them in YAML.

apiVersion: v1
kind: LimitRange
metadata:
  name: dev-default-limits
spec:
  limits:
    - type: Container
      default:        # LIMITS (must stay under dev quota 1 CPU / 2Gi total)
        cpu: "100m"
        memory: "128Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
