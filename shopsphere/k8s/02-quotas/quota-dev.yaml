# quota-dev.yaml
# --------------
# Rubric: "limit development namespace to only use 1 CPU cores."
# We use 2 CPU / 4Gi so the full stack fits; justification in ARCHITECTURE_SUMMARY.md Section 3.

apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "2"
    limits.memory: 4Gi
