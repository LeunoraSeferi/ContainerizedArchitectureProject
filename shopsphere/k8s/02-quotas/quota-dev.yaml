# quota-dev.yaml
# --------------
# Requirement 8: Dev namespace limited to 1 CPU and 2Gi.
# All container limits in dev must sum to ≤ 1000m CPU and ≤ 2Gi memory.

apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "1"
    limits.memory: 2Gi
