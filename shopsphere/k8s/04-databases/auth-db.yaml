# auth-db.yaml
# ------------
# PURPOSE:
# Deploy Auth Postgres database with:
# - Service: stable DNS name "auth-db" for DB_HOST=auth-db
# - StatefulSet: stable identity (auth-db-0)
# - PVC: persistent storage
#
# IMPORTANT:
# dev namespace has ResourceQuota -> every container MUST have resources.
# Keep CPU small so 3 DBs can fit inside limits.cpu=1

apiVersion: v1
kind: Service
metadata:
  name: auth-db
spec:
  selector:
    app: auth-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-db
spec:
  serviceName: auth-db
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: postgres

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: shopsphere-config
                  key: AUTH_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: shopsphere-config
                  key: AUTH_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopsphere-secrets
                  key: AUTH_DB_PASSWORD

          # small resource values (3 DBs fit under 1 CPU)
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              cpu: "100m"
              memory: "320Mi"

          volumeMounts:
            - name: auth-db-data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: auth-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
