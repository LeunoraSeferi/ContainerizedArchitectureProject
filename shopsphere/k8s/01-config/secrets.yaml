# ConfigMaps/Secrets are namespaced resources, so we apply them separately
# to dev / staging / production.
#
# secrets.yaml
# -----------
# PURPOSE:
# Store sensitive configuration values securely (passwords and JWT secret).
# These values MUST NOT be stored in ConfigMaps because ConfigMaps are for non-sensitive values.
#
# NOTE:
# We use "stringData" so we can write plain text here.
# Kubernetes will automatically store it as base64-encoded data internally.

apiVersion: v1
kind: Secret
metadata:
  name: shopsphere-secrets
type: Opaque
stringData:
  # JWT secret used by auth-service 
  JWT_SECRET: "supersecret"

  # Database passwords (sensitive) 
  AUTH_DB_PASSWORD: "authpass"
  CATALOG_DB_PASSWORD: "catalogpass"
  ORDER_DB_PASSWORD: "orderpass"
