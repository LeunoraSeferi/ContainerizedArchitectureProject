#ConfigMaps/Secrets are namespaced, so we apply them to dev/staging/prod.
# secrets.yaml
# ------------
# PURPOSE:
# Store sensitive configuration values securely.
# We use stringData so we can write plain text; Kubernetes stores it encoded.

apiVersion: v1
kind: Secret
metadata:
  name: shopsphere-secrets
type: Opaque
stringData:
  # Secret used to sign JWT tokens
  JWT_SECRET: "supersecret"

  # Database passwords (sensitive)
  AUTH_DB_PASSWORD: "authpass"
  CATALOG_DB_PASSWORD: "catalogpass"
  ORDER_DB_PASSWORD: "orderpass"
