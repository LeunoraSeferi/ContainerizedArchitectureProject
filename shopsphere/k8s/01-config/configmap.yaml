# =========================================================
# ConfigMap 1: shopsphere-config (NON-SECRET configuration)
# PURPOSE:
# Stores non-sensitive config values used by services.
# Injected into Pods as environment variables.
# =========================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: shopsphere-config
data:
  # Redis service (inside Kubernetes cluster)
  REDIS_URL: "redis://redis:6379"

  # Solr service URL (inside cluster)
  SOLR_URL: "http://solr:8983/solr/products"

  # Internal URLs between microservices (service-name:port)
  AUTH_URL: "http://auth-service:3001/api/v1"
  CATALOG_URL: "http://catalog-service:3002/api/v1"
  ORDERS_URL: "http://order-service:3003/api/v1"

  # Database connection info (NOT passwords)
  AUTH_DB_HOST: "auth-db"
  AUTH_DB_PORT: "5432"
  AUTH_DB_NAME: "authdb"
  AUTH_DB_USER: "authuser"

  CATALOG_DB_HOST: "catalog-db"
  CATALOG_DB_PORT: "5432"
  CATALOG_DB_NAME: "catalogdb"
  CATALOG_DB_USER: "cataloguser"

  ORDER_DB_HOST: "order-db"
  ORDER_DB_PORT: "5432"
  ORDER_DB_NAME: "orderdb"
  ORDER_DB_USER: "orderuser"

---
# =========================================================
# ConfigMap 2: auth-db-init (DB init SQL for PostgreSQL)
# PURPOSE:
# Fixes CrashLoopBackOff in auth-service by ensuring the
# "users" table exists when Postgres starts for the first time.
#
# IMPORTANT:
# This SQL runs ONLY on first initialization of the Postgres data dir.
# If you already have a PVC with old data, you must delete that PVC
# for auth-db so the init script runs.
# =========================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-db-init
data:
  auth-db-init.sql: |
    CREATE TABLE IF NOT EXISTS users (
      id SERIAL PRIMARY KEY,
      name VARCHAR(255) NOT NULL,
      email VARCHAR(255) UNIQUE NOT NULL,
      password_hash TEXT NOT NULL,
      role VARCHAR(50) DEFAULT 'admin',
      created_at TIMESTAMP DEFAULT NOW()
    );