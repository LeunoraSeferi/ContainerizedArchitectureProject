# Dev overlay: namespace dev only.
# No HPA in dev.
# Quota and LimitRange are applied separately from k8s/02-quotas.
#
# Apply:
#   kubectl apply -k shopsphere/k8s-overlays/dev
# Then:
#   kubectl apply -n dev -f shopsphere/k8s/02-quotas/quota-dev.yaml -f shopsphere/k8s/02-quotas/limitrange-dev.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../k8s
  - namespace.yaml

# DEV-ONLY PATCHES
# We reduce Solr memory footprint so it fits inside 1 CPU / 2Gi namespace quota
patches:
  - path: patch-solr-dev.yaml