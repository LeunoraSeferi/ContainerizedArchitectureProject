# Prod overlay: namespace + replicas=3. No quota. HPA applied from k8s/07-autoscaling (see README).
# Apply: kubectl apply -k shopsphere/k8s-overlays/prod
# Then: kubectl apply -n prod -f shopsphere/k8s/07-autoscaling/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../k8s
  - namespace.yaml

# Stable structure: at least 3 pods per deployment (mirrors staging)
replicas:
  - name: gateway
    count: 3
  - name: auth-service
    count: 3
  - name: catalog-service
    count: 3
  - name: order-service
    count: 3
  - name: redis
    count: 3
  - name: shopsphere-frontend
    count: 3
